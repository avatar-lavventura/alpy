name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # pull requests only check that it builds and the tests pass: no signing secrets, no release
      - name: Test and build (pull request)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Keystore
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk alpy.apk
          gh release create "v1.0.${{ github.run_number }}" alpy.apk --title "Alpy 1.0.${{ github.run_number }}" --notes "$NOTES"
